[project]
name = "c-bot"
version = "0.1.0"
description = "Crypto trading bot: dollar bars -> features -> NN direction model -> LLM veto -> backtest"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14",
    "requests>=2.31",
    "torch>=2.2",
    "lightgbm>=4.6.0",
    "websocket-client>=1.9.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

# local dùng wheel CPU cho nhẹ; trên Kaggle torch GPU có sẵn
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
