[project]
name = "c-bot"
version = "0.1.0"
description = "Crypto trading bot: dollar bars -> features -> NN direction model -> LLM veto -> backtest"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
